<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Paleta de Colores</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light text-dark py-4">

  <div class="container" style="max-width: 900px;">
    
    <!-- Header -->
    <header class="text-center mb-4">
      <h1 class="display-5 fw-bold text-primary">Generador de Paleta de Colores</h1>
      <p class="text-secondary fw-semibold">Arquitectura Cliente-Servidor | UNISANGIL</p>
    </header>

    <main>
      <!-- Card Búsqueda -->
      <section class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <label for="input-color" class="form-label fw-bold mb-3">Selecciona o escribe un color (HEX / Nombre):</label>
          <div class="input-group mb-3">
            <!-- Picker de Bootstrap / HTML5 -->
            <input id="picker-color" type="color" class="form-control form-control-color p-1" value="#4f46e5" title="Seleccionar color del espectro" style="max-width: 60px;">
            <input id="input-color" type="text" class="form-control form-control-lg" placeholder="Ej. #4F46E5 o rojo" value="#4f46e5">
            <button id="btn-buscar" type="button" class="btn btn-primary px-4 fw-bold">Generar Paleta</button>
          </div>
          <!-- Notificación accesible ARIA -->
          <p id="mensaje" class="fw-bold text-muted mb-0" aria-live="polite" role="status"></p>
        </div>
      </section>

      <!-- Card Historial -->
      <section class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <h2 class="h5 card-title fw-bold text-secondary mb-3">Búsquedas Recientes:</h2>
          <ul id="lista-historial" class="d-flex flex-wrap gap-2 list-unstyled mb-0"></ul>
        </div>
      </section>

      <!-- Card Resultados -->
      <section class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="h5 card-title fw-bold text-secondary mb-3">Paleta Generada (Clic en la tarjeta para copiar HEX):</h2>
          <!-- Contenedor con grilla interactiva -->
          <div id="contenedor-paleta" class="row g-3"></div>
        </div>
      </section>
    </main>
    
  </div>

  <!-- Bootstrap 5 Bundle JS (Opcional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="funcion.mjs"></script>
</body>
</html>
